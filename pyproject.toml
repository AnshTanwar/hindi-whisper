[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hindi-whisper"
version = "0.1.0"
description = "LoRA fine-tune, Distil-Whisper student, and LocalAgreement streaming on public Hindi speech."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Ansh Tanwar" }]
dependencies = [
  "numpy",
  "pyyaml",
  "torch",
  "transformers>=4.45",
  "datasets[audio]>=2.20",
  "accelerate>=0.34",
  "peft",
  "jiwer",
  "soundfile",
  "librosa",
]

[project.scripts]
hindi-whisper = "hindi_whisper.experiment:main"

[tool.setuptools.packages.find]
where = ["src"]
